name: ribbonfish

services:
  agent:
    image: cyanautomation/ribbonfish:latest
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: ${RIBBONFISH_NETWORK_MODE:-none}

    environment:
      RIBBONFISH_PROFILE: ${RIBBONFISH_PROFILE:?Set RIBBONFISH_PROFILE in .env}
      RIBBONFISH_DRM_DEVICE: ${RIBBONFISH_DRM_DEVICE:?Set RIBBONFISH_DRM_DEVICE in .env}
      RIBBONFISH_SYNC_URL: ${RIBBONFISH_SYNC_URL:-}
      RIBBONFISH_SYNC_INTERVAL: ${RIBBONFISH_SYNC_INTERVAL:-1m}
      RIBBONFISH_DEVICE_ID: ${RIBBONFISH_DEVICE_ID:-}
      RIBBONFISH_DEVICE_TOKEN_FILE: /var/lib/ribbonfish/device-token

    devices:
      - "${RIBBONFISH_DRM_DEVICE:?Set RIBBONFISH_DRM_DEVICE in .env}:${RIBBONFISH_DRM_DEVICE:?Set RIBBONFISH_DRM_DEVICE in .env}"

    group_add:
      - "${RIBBONFISH_DRM_GID:?Set RIBBONFISH_DRM_GID in .env}"

    volumes:
      - ribbonfish-state:/var/lib/ribbonfish

volumes:
  ribbonfish-state:
