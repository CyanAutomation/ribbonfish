name: ribbonfish

services:
  agent:
    image: cyanautomation/ribbonfish-agent:${RIBBONFISH_VERSION:?Set RIBBONFISH_VERSION}
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    command: ["-config", "${RIBBONFISH_CONFIG_FILE:-/etc/ribbonfish/config.json}"]
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: none

    environment:
      RIBBONFISH_CONFIG_FILE: ${RIBBONFISH_CONFIG_FILE:-/etc/ribbonfish/config.json}
      RIBBONFISH_DRM_DEVICE: ${RIBBONFISH_DRM_DEVICE:?Set RIBBONFISH_DRM_DEVICE}
      RIBBONFISH_CACHE_DIR: ${RIBBONFISH_CACHE_DIR:-/var/lib/ribbonfish/cache}

    devices:
      - "${RIBBONFISH_DRM_DEVICE:?Set RIBBONFISH_DRM_DEVICE}:${RIBBONFISH_DRM_DEVICE:?Set RIBBONFISH_DRM_DEVICE}"

    group_add:
      - "${RIBBONFISH_DRM_GID:?Set RIBBONFISH_DRM_GID}"

    volumes:
      - ribbonfish-cache:/var/lib/ribbonfish/cache
      - ${RIBBONFISH_LOCAL_CONFIG:-./hardware-config.pi4.json}:/etc/ribbonfish/config.json:ro
      - ../agent/simulator/assets:/assets:ro

volumes:
  ribbonfish-cache:
