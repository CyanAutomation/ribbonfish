name: ribbonfish

services:
  agent:
    image: cyanautomation/ribbonfish:${RIBBONFISH_VERSION:?Set RIBBONFISH_VERSION to a published sha-<commit> tag}
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: ${RIBBONFISH_NETWORK_MODE:-none}

    environment:
      RIBBONFISH_PROFILE: ${RIBBONFISH_PROFILE:-pi4}
      RIBBONFISH_DRM_DEVICE: ${RIBBONFISH_DRM_DEVICE:-/dev/dri/card1}
      RIBBONFISH_CACHE_DIR: ${RIBBONFISH_CACHE_DIR:-/var/lib/ribbonfish/cache}
      RIBBONFISH_SYNC_URL: ${RIBBONFISH_SYNC_URL:-}
      RIBBONFISH_SYNC_INTERVAL: ${RIBBONFISH_SYNC_INTERVAL:-1m}
      RIBBONFISH_DEVICE_ID: ${RIBBONFISH_DEVICE_ID:-}
      RIBBONFISH_DEVICE_TOKEN_FILE: /var/lib/ribbonfish/device-token

    devices:
      - "${RIBBONFISH_DRM_DEVICE:-/dev/dri/card1}:${RIBBONFISH_DRM_DEVICE:-/dev/dri/card1}"

    group_add:
      - "${RIBBONFISH_DRM_GID:-44}"

    volumes:
      - ribbonfish-state:/var/lib/ribbonfish

volumes:
  ribbonfish-state:
