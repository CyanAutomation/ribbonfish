# Run the bundled software display profile without config or asset mounts.
name: ribbonfish-pi-simulator

services:
  agent:
    image: ribbonfish:software-simulator
    platform: linux/arm64
    build:
      context: ../../agent
    environment:
      RIBBONFISH_PROFILE: ${RIBBONFISH_SIMULATOR_PROFILE:-simulator-pi3a-plus}
    cpus: ${RIBBONFISH_SIMULATOR_CPUS:-4}
    mem_limit: ${RIBBONFISH_SIMULATOR_MEMORY_LIMIT:-512m}
    user: "65532:65532"
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: none
    volumes:
      - simulator-state:/var/lib/ribbonfish

volumes:
  simulator-state:
