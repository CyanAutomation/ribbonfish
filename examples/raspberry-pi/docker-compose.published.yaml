# Run the published image with bundled simulator config and images.
# Set RIBBONFISH_VERSION to a sha tag to pin a run. No config or assets are mounted.
name: ribbonfish-published-simulator

services:
  agent:
    image: cyanautomation/ribbonfish:${RIBBONFISH_VERSION:-latest}
    environment:
      RIBBONFISH_PROFILE: simulator
      RIBBONFISH_CACHE_DIR: /var/lib/ribbonfish/cache
    user: "65532:65532"
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: none
    volumes:
      - published-simulator-state:/var/lib/ribbonfish

volumes:
  published-simulator-state:
