# Run the published multi-architecture image in software simulator mode.
# This pulls from Docker Hub and writes PNG frames; it does not access DRM/HDMI.
name: ribbonfish-published-simulator

services:
  agent:
    image: cyanautomation/ribbonfish-agent:${RIBBONFISH_VERSION:?Set RIBBONFISH_VERSION to a published sha tag}
    command: ["-config", "/etc/ribbonfish/config.json"]
    user: "65532:65532"
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: none
    volumes:
      - ./simulator-config.json:/etc/ribbonfish/config.json:ro
      - ../agent/simulator/assets:/assets:ro
      - published-simulator-cache:/var/lib/ribbonfish/cache
      - published-simulator-frames:/var/lib/ribbonfish/frames

volumes:
  published-simulator-cache:
  published-simulator-frames:
