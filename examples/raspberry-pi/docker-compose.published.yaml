# Run the published image with bundled simulator config and images.
# The published-image simulator uses the latest image. No config or assets are mounted.
name: ribbonfish-published-simulator

services:
  agent:
    image: cyanautomation/ribbonfish:latest
    environment:
      RIBBONFISH_PROFILE: ${RIBBONFISH_SIMULATOR_PROFILE:-simulator-pi3a-plus}
    cpus: ${RIBBONFISH_SIMULATOR_CPUS:-4}
    mem_limit: ${RIBBONFISH_SIMULATOR_MEMORY_LIMIT:-512m}
    user: "65532:65532"
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: none
    volumes:
      - published-simulator-state:/var/lib/ribbonfish

volumes:
  published-simulator-state:
