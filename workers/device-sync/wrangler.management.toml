name = "ribbonfish-mgmt"
account_id = "c40f3cb30efbf8c6d081cf9e50a61931"
main = "src/index.js"
compatibility_date = "2026-10-26"
workers_dev = true

[vars]
ADMIN_ENABLED = "true"
ADMIN_ACCESS_REQUIRED = "true"
DAILY_BROWSER_BUDGET_MS = "540000"
CAPTURE_BUDGET_RESERVE_MS = "45000"
CAPTURE_MIN_REQUEST_GAP_MS = "10000"
CAPTURE_MAX_PENDING = "100"
ASSET_RECONCILIATION_INTERVAL_SECONDS = "900"
CAPTURE_ALLOWED_HOSTS = ""
CAPTURE_VALIDATOR_HOSTS = ""
CAPTURE_ANALYSIS_MODE = "shadow"

[observability]
enabled = true

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "ribbonfish-assets"

[[d1_databases]]
binding = "DB"
database_name = "ribbonfish-devices"
database_id = "f17f5835-614a-4896-bb4c-12edc1b3546a"
migrations_dir = "migrations"

[[ratelimits]]
name = "ENROLLMENT_RATE_LIMITER"
namespace_id = "84310627"
simple = { limit = 30, period = 60 }

[browser]
binding = "BROWSER"
remote = true

[[queues.producers]]
binding = "CAPTURE_QUEUE"
queue = "ribbonfish-captures"

[[queues.consumers]]
queue = "ribbonfish-captures"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3
dead_letter_queue = "ribbonfish-capture-dead-letter"
max_concurrency = 1
retry_delay = 60

[triggers]
crons = ["* * * * *"]
