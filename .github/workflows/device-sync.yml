name: Cloudflare device sync Worker

on:
  push:
    branches:
      - main
    paths:
      - "workers/device-sync/**"
      - ".github/workflows/device-sync.yml"
  pull_request:
    paths:
      - "workers/device-sync/**"
      - ".github/workflows/device-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Wrangler
        working-directory: workers/device-sync
        run: npm ci
      - name: Build management console assets
        working-directory: workers/device-sync
        run: npm run build:admin
      - name: Test Worker routes and authorization
        working-directory: workers/device-sync
        run: npm test
      - name: Validate production and development Worker bundles
        working-directory: workers/device-sync
        run: npm run check:config

  deploy-dev:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: management-console-dev-deploy
      cancel-in-progress: false
    environment: cloudflare-dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Wrangler
        working-directory: workers/device-sync
        run: npm ci
      - name: Deploy isolated management Worker
        working-directory: workers/device-sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:dev
