name: Cloudflare device sync Worker

on:
  push:
    branches:
      - main
    paths:
      - "workers/device-sync/**"
      - ".github/workflows/device-sync.yml"
  # Keep this unfiltered so required checks are reported for every PR.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: workers/device-sync/.nvmrc
          cache: npm
          cache-dependency-path: workers/device-sync/package-lock.json
      - name: Install pinned Wrangler
        working-directory: workers/device-sync
        run: npm ci
      - name: Build management console assets
        working-directory: workers/device-sync
        run: npm run build:admin
      - name: Test Worker routes and authorization
        working-directory: workers/device-sync
        run: npm test
      - name: Validate production and development Worker bundles
        working-directory: workers/device-sync
        run: npm run check:config

  deploy-dev:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Restrict this environment to main and store CLOUDFLARE_API_TOKEN in it.
    environment: device-sync-dev
    concurrency:
      group: management-console-dev-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: workers/device-sync/.nvmrc
          cache: npm
          cache-dependency-path: workers/device-sync/package-lock.json
      - name: Install pinned Wrangler
        working-directory: workers/device-sync
        run: npm ci
      - name: Deploy isolated management Worker
        working-directory: workers/device-sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:dev
