name: Cloudflare Worker validation

on:
  push:
    branches:
      - main
    paths:
      - "workers/device-sync/**"
      - ".github/workflows/device-sync.yml"
      - ".github/workflows/deploy-device-sync.yml"
  # Keep this unfiltered so required checks are reported for every PR.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: workers/device-sync/.nvmrc
          cache: npm
          cache-dependency-path: workers/device-sync/package-lock.json
      - name: Install pinned Wrangler
        working-directory: workers/device-sync
        run: npm ci
      - name: Build management console assets
        working-directory: workers/device-sync
        run: npm run build:admin
      - name: Test Worker routes and authorization
        working-directory: workers/device-sync
        run: npm test
      - name: Validate production Worker bundles
        working-directory: workers/device-sync
        run: npm run check:config
