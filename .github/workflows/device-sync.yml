name: Cloudflare device sync Worker

on:
  push:
    branches:
      - main
    paths:
      - "workers/device-sync/**"
      - ".github/workflows/device-sync.yml"
  pull_request:
    paths:
      - "workers/device-sync/**"
      - ".github/workflows/device-sync.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test Worker routes and authorization
        working-directory: workers/device-sync
        run: node --test
