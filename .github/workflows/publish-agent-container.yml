name: Publish agent container

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/agent.yml
    permissions:
      contents: read

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a semantic version tag such as v1.2.3" >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish ARM images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./agent
          platforms: linux/arm/v7,linux/arm64
          push: true
          tags: ghcr.io/cyanautomation/ribbonfish-agent:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/CyanAutomation/ribbonfish
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
