name: Publish Raspberry Pi agent image

on:
  push:
    branches:
      - main
    paths:
      - "agent/**"
      - ".github/workflows/publish-agent.yml"
      - ".github/workflows/verify-agent.yml"

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify-agent.yml

  publish:
    needs: verify
    if: github.ref_protected
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: publish-ribbonfish-ghcr-main
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/cyanautomation/ribbonfish
          flavor: latest=false
          tags: |
            type=sha,format=long
      - name: Build and publish ARM images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./agent
          platforms: linux/arm/v7,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - name: Promote current main image to main
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$main_sha" != "$IMAGE_SHA" ]; then
            echo "main has advanced; keeping main on the newer publish"
            exit 0
          fi
          docker buildx imagetools create \
            --tag ghcr.io/cyanautomation/ribbonfish:main \
            "ghcr.io/cyanautomation/ribbonfish:sha-${IMAGE_SHA}"
