name: Verify and publish agent images

on:
  push:
    branches:
      - main
    paths:
      - "agent/**"
      - ".github/workflows/agent.yml"
      - ".github/workflows/publish-agent.yml"
      - ".github/workflows/docker-publish.yml"
      - ".github/workflows/verify-agent.yml"
      - ".github/workflows/arm-container-smoke.yml"
      - ".github/scripts/release-freshness.mts"

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify-agent.yml

  smoke:
    uses: ./.github/workflows/arm-container-smoke.yml

  publish-ghcr:
    needs: [verify, smoke]
    if: github.ref_protected
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: publish-ribbonfish-ghcr-main
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/cyanautomation/ribbonfish
          flavor: latest=false
          tags: |
            type=sha,format=long
      - name: Build and publish ARM images
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./agent
          platforms: linux/arm/v7,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=ribbonfish-ghcr
          cache-to: type=gha,scope=ribbonfish-ghcr,mode=max
          provenance: true
          sbom: true
      - name: Scan published GHCR ARMv7 image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm/v7
        with:
          image-ref: ghcr.io/cyanautomation/ribbonfish@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Scan published GHCR ARM64 image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ghcr.io/cyanautomation/ribbonfish@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Attest GHCR image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/cyanautomation/ribbonfish
          subject-digest: ${{ steps.build.outputs.digest }}
      - name: Smoke test the published ARM images
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          sh agent/scripts/smoke-container.sh linux/arm/v7 pi3b "ghcr.io/cyanautomation/ribbonfish@${IMAGE_DIGEST}"
          sh agent/scripts/smoke-container.sh linux/arm64 pi4 "ghcr.io/cyanautomation/ribbonfish@${IMAGE_DIGEST}"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - name: Check whether agent image tags are current
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-freshness.mts agent --allow-stale
      - name: Promote current main image to main
        if: steps.freshness.outcome == 'success' && steps.freshness.outputs.current == 'true'
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/cyanautomation/ribbonfish:main \
            "ghcr.io/cyanautomation/ribbonfish:sha-${IMAGE_SHA}"

  publish-dockerhub:
    needs: [verify, smoke]
    if: github.ref_protected
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: docker
    concurrency:
      group: docker-hub-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Generate image tags
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: docker.io/${{ vars.DOCKERHUB_USERNAME }}/ribbonfish
          flavor: latest=false
          tags: |
            type=sha,format=long
      - name: Build and publish multi-architecture image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./agent
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=ribbonfish-dockerhub
          cache-to: type=gha,scope=ribbonfish-dockerhub,mode=max
          provenance: mode=max
          sbom: true
      - name: Scan published Docker Hub AMD64 image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: docker.io/${{ vars.DOCKERHUB_USERNAME }}/ribbonfish@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Scan published Docker Hub ARM64 image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: docker.io/${{ vars.DOCKERHUB_USERNAME }}/ribbonfish@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Scan published Docker Hub ARMv7 image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm/v7
        with:
          image-ref: docker.io/${{ vars.DOCKERHUB_USERNAME }}/ribbonfish@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Attest Docker Hub image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: docker.io/${{ vars.DOCKERHUB_USERNAME }}/ribbonfish
          subject-digest: ${{ steps.build.outputs.digest }}
      - name: Smoke test published images
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          sh agent/scripts/smoke-container.sh linux/amd64 pi4 "docker.io/${DOCKERHUB_USERNAME}/ribbonfish@${IMAGE_DIGEST}"
          sh agent/scripts/smoke-container.sh linux/arm/v7 pi3b "docker.io/${DOCKERHUB_USERNAME}/ribbonfish@${IMAGE_DIGEST}"
          sh agent/scripts/smoke-container.sh linux/arm64 pi4 "docker.io/${DOCKERHUB_USERNAME}/ribbonfish@${IMAGE_DIGEST}"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - name: Check whether agent image tags are current
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-freshness.mts agent --allow-stale
      - name: Promote current main image to latest
        if: steps.freshness.outcome == 'success' && steps.freshness.outputs.current == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          docker buildx imagetools create \
            --tag "docker.io/${DOCKERHUB_USERNAME}/ribbonfish:latest" \
            "docker.io/${DOCKERHUB_USERNAME}/ribbonfish:sha-${IMAGE_SHA}"
