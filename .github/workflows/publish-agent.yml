name: Publish Raspberry Pi agent image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-ribbonfish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require release commit to be reachable from main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tags must point to commits reachable from main." >&2
            exit 1
          }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod
      - name: Check formatting and static analysis
        working-directory: agent
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
      - name: Check for known Go vulnerabilities
        working-directory: agent
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Run tests with race detector
        working-directory: agent
        run: go test -race ./...
      - name: Cross-compile ARMv7
        working-directory: agent
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: "7"
        run: go build -o /tmp/ribbonfish-linux-armv7 ./cmd/ribbonfish
      - name: Cross-compile ARM64
        working-directory: agent
        env:
          GOOS: linux
          GOARCH: arm64
        run: go build -o /tmp/ribbonfish-linux-arm64 ./cmd/ribbonfish
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/cyanautomation/ribbonfish
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - name: Build and publish ARM images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./agent
          platforms: linux/arm/v7,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
