name: ARM container smoke test

on:
  push:
    paths:
      - "agent/**"
      - "examples/agent/simulator/**"
      - ".github/workflows/arm-container-smoke.yml"
  pull_request:
    paths:
      - "agent/**"
      - "examples/agent/simulator/**"
      - ".github/workflows/arm-container-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/arm/v7
            profile: pi3b
          - platform: linux/arm64
            profile: pi4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build and run the emulated agent container
        run: sh agent/scripts/smoke-container.sh "${{ matrix.platform }}" "${{ matrix.profile }}"
