name: ARM container smoke test

on:
  push:
    branches:
      - main
    paths:
      - "agent/**"
      - "examples/agent/simulator/**"
      - "examples/raspberry-pi/**"
      - ".github/workflows/arm-container-smoke.yml"
  pull_request:
    paths:
      - "agent/**"
      - "examples/agent/simulator/**"
      - "examples/raspberry-pi/**"
      - ".github/workflows/arm-container-smoke.yml"

# Keep one run per PR or main branch and stop superseded QEMU work.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/arm/v7
            profile: pi3b
          - platform: linux/arm64
            profile: pi4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Validate Raspberry Pi Compose examples
        env:
          RIBBONFISH_VERSION: ci
          RIBBONFISH_DRM_DEVICE: /dev/dri/card1
          RIBBONFISH_DRM_GID: "44"
        run: |
          python3 -m json.tool examples/raspberry-pi/hardware-config.pi3b.json >/dev/null
          python3 -m json.tool examples/raspberry-pi/hardware-config.pi3a-plus.json >/dev/null
          python3 -m json.tool examples/raspberry-pi/hardware-config.pi4.json >/dev/null
          python3 -m json.tool examples/raspberry-pi/simulator-config.pi3a-plus.json >/dev/null
          docker compose -f examples/raspberry-pi/docker-compose.simulator.yaml config --quiet
          RIBBONFISH_SIMULATOR_CONFIG=./simulator-config.pi3a-plus.json docker compose -f examples/raspberry-pi/docker-compose.simulator.yaml config --quiet
          RIBBONFISH_LOCAL_CONFIG=./hardware-config.pi3a-plus.json RIBBONFISH_DRM_DEVICE=/dev/dri/card0 docker compose -f examples/raspberry-pi/docker-compose.yaml config --quiet
          RIBBONFISH_LOCAL_CONFIG=./hardware-config.pi3b.json RIBBONFISH_DRM_DEVICE=/dev/dri/card0 docker compose -f examples/raspberry-pi/docker-compose.yaml config --quiet
          RIBBONFISH_LOCAL_CONFIG=./hardware-config.pi4.json RIBBONFISH_DRM_DEVICE=/dev/dri/card1 docker compose -f examples/raspberry-pi/docker-compose.yaml config --quiet
      - name: Build and run the emulated agent container
        run: sh agent/scripts/smoke-container.sh "${{ matrix.platform }}" "${{ matrix.profile }}"
