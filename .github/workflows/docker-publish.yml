name: Publish agent image to Docker Hub

on:
  push:
    branches:
      - main
    paths:
      - "agent/**"
      - ".github/workflows/docker-publish.yml"
      - ".github/workflows/verify-agent.yml"

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify-agent.yml

  publish:
    needs: verify
    if: github.ref_protected
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: docker
    concurrency:
      group: docker-hub-publish
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: Build and publish multi-architecture image by commit
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64,linux/arm/v7 \
            --tag "docker.io/${DOCKERHUB_USERNAME}/ribbonfish:sha-${IMAGE_SHA}" \
            --provenance=mode=max \
            --sbom=true \
            --push \
            ./agent
      - name: Promote current main image to latest
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$main_sha" != "$IMAGE_SHA" ]; then
            echo "main has advanced; keeping latest on the newer publish"
            exit 0
          fi
          docker buildx imagetools create \
            --tag "docker.io/${DOCKERHUB_USERNAME}/ribbonfish:latest" \
            "docker.io/${DOCKERHUB_USERNAME}/ribbonfish:sha-${IMAGE_SHA}"
