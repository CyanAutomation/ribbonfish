name: Publish agent image to Docker Hub

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod
      - name: Check formatting
        working-directory: agent
        run: test -z "$(gofmt -l .)"
      - name: Static analysis
        working-directory: agent
        run: go vet ./...
      - name: Check for known Go vulnerabilities
        working-directory: agent
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Unit tests with race detector
        working-directory: agent
        run: go test -race ./...
      - name: Cross-compile Linux ARMv7
        working-directory: agent
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: "7"
        run: go build -o /tmp/ribbonfish-linux-armv7 ./cmd/ribbonfish
      - name: Cross-compile Linux ARM64
        working-directory: agent
        env:
          GOOS: linux
          GOARCH: arm64
        run: go build -o /tmp/ribbonfish-linux-arm64 ./cmd/ribbonfish

  publish:
    needs: verify
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: docker
    concurrency:
      group: docker-hub-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: Build and publish multi-architecture image by commit
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64,linux/arm/v7 \
            --tag "docker.io/${DOCKERHUB_USERNAME}/ribbonfish:sha-${MERGE_COMMIT_SHA}" \
            --provenance=mode=max \
            --sbom=true \
            --push \
            ./agent
      - name: Promote current main image to latest
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$main_sha" != "$MERGE_COMMIT_SHA" ]; then
            echo "main has advanced; keeping latest on the newer publish"
            exit 0
          fi
          docker buildx imagetools create \
            --tag "docker.io/${DOCKERHUB_USERNAME}/ribbonfish:latest" \
            "docker.io/${DOCKERHUB_USERNAME}/ribbonfish:sha-${MERGE_COMMIT_SHA}"
