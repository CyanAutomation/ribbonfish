name: Go agent

on:
  push:
    paths:
      - "agent/**"
      - ".github/workflows/agent.yml"
  pull_request:
    paths:
      - "agent/**"
      - ".github/workflows/agent.yml"

permissions:
  contents: read

jobs:
  test-and-cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod
      - name: Check formatting
        working-directory: agent
        run: test -z "$(gofmt -l .)"
      - name: Static analysis
        working-directory: agent
        run: go vet ./...
      - name: Unit tests
        working-directory: agent
        run: go test ./...
      - name: Cross-compile Linux ARMv7
        working-directory: agent
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: "7"
        run: go build -o /tmp/ribbonfish-linux-armv7 ./cmd/ribbonfish
      - name: Cross-compile Linux ARM64
        working-directory: agent
        env:
          GOOS: linux
          GOARCH: arm64
        run: go build -o /tmp/ribbonfish-linux-arm64 ./cmd/ribbonfish
