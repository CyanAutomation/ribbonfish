name: Go agent

on:
  push:
    branches:
      - main
    paths:
      - "agent/**"
      - ".github/workflows/agent.yml"
      - ".github/workflows/verify-agent.yml"
  # Keep this unfiltered so required checks are reported for every PR.
  pull_request:

# Keep one run per PR or main branch and stop superseded work.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-cross-compile:
    uses: ./.github/workflows/verify-agent.yml
