name: Go agent

on:
  # Keep this unfiltered so required checks are reported for every PR.
  pull_request:

# Keep one run per PR and stop superseded work.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-cross-compile:
    uses: ./.github/workflows/verify-agent.yml
