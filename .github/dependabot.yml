version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
  - package-ecosystem: npm
    directory: /workers/device-sync
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: docker
    directory: /agent
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(docker)
